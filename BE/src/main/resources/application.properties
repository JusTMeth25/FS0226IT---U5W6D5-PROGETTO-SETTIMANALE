spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/U5W6D5-PROGETTO-SETTIMANALE
spring.datasource.username=${DB_USERNAME:postgres}
# No default on purpose: set DB_PASSWORD in the environment before starting.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.same-site=lax

app.cors.allowed-origin=http://localhost:5173

# Structured JSON log file (one event per line) read by the log-agent; console stays plain text.
logging.file.name=logs/app.log
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.com.example.demo=INFO
logging.level.AUDIT=INFO
