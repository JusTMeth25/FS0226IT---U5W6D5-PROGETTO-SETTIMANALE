spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/U5W6D5-PROGETTO-SETTIMANALE
spring.datasource.username=${DB_USERNAME:postgres}
# No default on purpose: set DB_PASSWORD in the environment before starting.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.same-site=lax

app.cors.allowed-origin=http://localhost:5173

# Structured JSON log file (one event per line) read by the log-agent; console stays plain text.
logging.file.name=logs/app.log
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.com.example.demo=INFO
logging.level.AUDIT=INFO

# AI reply suggestion through OpenRouter (OpenAI-compatible API). The key comes from the
# environment; without it the suggestion endpoint answers 503 and the rest keeps working.
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3.5-lightning:free}
openrouter.context-messages=20
# max_tokens of each suggestion: every user picks a value in this range in the settings.
# It covers the reasoning tokens too, so keep the minimum well above a short reply.
openrouter.max-tokens.default=1500
openrouter.max-tokens.min=1000
openrouter.max-tokens.max=4000
# Sends "reasoning": {"enabled": true}; the model thinks before answering (slower, better replies).
openrouter.reasoning=${OPENROUTER_REASONING:true}

# Account stats by email (Gmail SMTP). MAIL_PASSWORD is a Google App Password.
# Every stats email goes to MAIL_USERNAME, whoever asks for it.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
